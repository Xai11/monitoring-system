global:
  resolve_timeout: 5m
  # Uncomment and set SLACK_WEBHOOK_URL env var to enable Slack alerts:
  # slack_api_url: '${SLACK_WEBHOOK_URL}'

route:
  group_by: ['alertname', 'severity', 'job']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default
  routes:
    - match:
        severity: critical
      receiver: default
      group_wait: 5s
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: default

receivers:
  - name: default
    # Slack receiver — enable by setting SLACK_WEBHOOK_URL and uncommenting:
    # slack_configs:
    #   - api_url: '${SLACK_WEBHOOK_URL}'
    #     channel: '#eda-alerts'
    #     send_resolved: true
    #     title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
    #     text: >-
    #       {{ range .Alerts }}
    #       *Alert:* {{ .Annotations.summary }}
    #       *Details:* {{ .Annotations.description }}
    #       {{ end }}

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname', 'job']
