global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:

  # OTel Collector — метрики из OTLP-pipeline (с exemplars в OpenMetrics формате)
  - job_name: otel-collector
    scrape_interval: 15s
    static_configs:
      - targets: ['otel-collector:8889']

  # Spring Boot Actuator — прямой scrape (надёжные Micrometer-метрики)
  - job_name: order-service
    scrape_interval: 15s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['order-service:8081']

  - job_name: payment-service
    scrape_interval: 15s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['payment-service:8082']

  - job_name: shipping-service
    scrape_interval: 15s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['shipping-service:8083']

  - job_name: analytics-service
    scrape_interval: 15s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['analytics-service:8084']

  # Kafka Exporter — consumer lag и топики
  - job_name: kafka-exporter
    scrape_interval: 15s
    static_configs:
      - targets: ['kafka-exporter:9308']

  # Alertmanager self-scrape
  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  # Prometheus self-scrape
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
