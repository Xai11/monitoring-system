extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    limit_mib: 400
    spike_limit_mib: 100
    check_interval: 5s

  batch:
    timeout: 1s
    send_batch_size: 1024

  # Добавляем environment label ко всем сигналам
  resource:
    attributes:
      - action: upsert
        key: deployment.environment
        value: local

  # Tail-based sampling: решение принимается после получения всего trace.
  # Политика always_sample для прототипа — меняй на probabilistic или error-only для продакшена.
  tail_sampling:
    decision_wait: 10s
    num_traces: 10000
    expected_new_traces_per_sec: 100
    policies:
      - name: always-sample
        type: always_sample
      # Раскомментировать для продакшена:
      # - name: sample-errors
      #   type: status_code
      #   status_code: {status_codes: [ERROR]}
      # - name: probabilistic-10pct
      #   type: probabilistic
      #   probabilistic: {sampling_percentage: 10}

  # Добавляем hint для Loki: какие resource-атрибуты станут лейблами
  resource/loki:
    attributes:
      - action: insert
        key: loki.resource.labels
        value: "service.name,service.version,deployment.environment"

exporters:
  # Трассировки → Jaeger (OTLP gRPC)
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Метрики → Prometheus (scrape endpoint на :8889)
  # enable_open_metrics=true позволяет Prometheus собирать exemplars
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: otel
    send_timestamps: true
    enable_open_metrics: true
    add_metric_suffixes: true
    resource_to_telemetry_conversion:
      enabled: true   # resource attrs → metric labels (service_name, etc.)

  # Журналы → Loki
  loki:
    endpoint: "http://loki:3100/loki/api/v1/push"
    tls:
      insecure: true
    default_labels_enabled:
      exporter: false
      job: true
      instance: false
      level: true

  # Traces → Kafka (consumed by monitoring-service Kafka Streams)
  kafka/traces:
    brokers: ["kafka:9092"]
    topic: otel.spans
    encoding: otlp_json
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 60s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      queue_size: 1000

  debug:
    verbosity: normal

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      # tail_sampling MUST precede batch: it holds spans until decision_wait,
      # then batch flushes the accepted traces to the exporter.
      processors: [memory_limiter, resource, tail_sampling, batch]
      exporters: [otlp/jaeger, kafka/traces]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, resource/loki, batch]
      exporters: [loki]

  telemetry:
    logs:
      level: info
